name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Demo format
        run: cargo fmt --manifest-path demos/order_system/Cargo.toml -- --check
      - name: Demo clippy
        run: cargo clippy --manifest-path demos/order_system/Cargo.toml --all-targets -- -D warnings
      - name: Demo test
        run: cargo test --manifest-path demos/order_system/Cargo.toml --locked
      - name: Market-data format
        run: cargo fmt --manifest-path demos/market_data_system/Cargo.toml -- --check
      - name: Market-data clippy
        run: cargo clippy --manifest-path demos/market_data_system/Cargo.toml --all-targets -- -D warnings
      - name: Market-data test
        run: cargo test --manifest-path demos/market_data_system/Cargo.toml --locked

  async-wal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Async WAL clippy
        run: cargo clippy --all-targets --features async-wal -- -D warnings
      - name: Async WAL crash recovery
        run: cargo test --features async-wal --test cluster async_wal --locked

  marketdata-aeron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rusteron is pinned to 0.2.13 and uses precompiled Aeron C libraries
      # (`static`, `precompile-rustls`); no Java or cmake is required, but the
      # static Linux link needs the uuid and bsd development libraries.
      - name: Install Aeron system libraries
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev uuid-dev
      - name: Engine Aeron sink test
        run: cargo test --features market-data-aeron --lib market_data::aeron --locked
      - name: Market-data Aeron end-to-end test
        run: cargo test --manifest-path demos/market_data_system/Cargo.toml --features aeron --test aeron --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check --all-targets --locked
