name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: |
          cargo fmt --manifest-path match_engine/Cargo.toml --all -- --check
          cargo fmt --manifest-path match_engine/fuzz/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path match_engine/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path match_engine/Cargo.toml
      - name: Demo format
        run: cargo fmt --manifest-path order_system/Cargo.toml -- --check
      - name: Demo clippy
        run: cargo clippy --manifest-path order_system/Cargo.toml --all-targets -- -D warnings
      - name: Demo test
        run: cargo test --manifest-path order_system/Cargo.toml --locked
      - name: Market-data format
        run: cargo fmt --manifest-path market_data_system/Cargo.toml -- --check
      - name: Market-data clippy
        run: cargo clippy --manifest-path market_data_system/Cargo.toml --all-targets -- -D warnings
      - name: Market-data test
        run: cargo test --manifest-path market_data_system/Cargo.toml --locked

  k8s-control-plane:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: k8s_control_plane
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build control-plane manifests
        run: |
          kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s_control_plane/deploy > /dev/null
          kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s_control_plane/overlays/lab > /dev/null
      - name: Build production overlay with template digests
        run: |
          sed -e 's|REGISTRY|registry.example.com|g' \
              -e "s|REPLACE_ME|$(printf '0%.0s' $(seq 1 64))|g" \
              k8s_control_plane/overlays/production/images.patch.yaml.example \
              > k8s_control_plane/overlays/production/images.patch.yaml
          kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s_control_plane/overlays/production > /dev/null

  async-wal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Async WAL clippy
        run: cargo clippy --manifest-path match_engine/Cargo.toml --all-targets --features async-wal -- -D warnings
      - name: Async WAL crash recovery
        run: cargo test --manifest-path match_engine/Cargo.toml --features async-wal --test cluster async_wal --locked

  profiling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Profiling clippy
        run: cargo clippy --manifest-path match_engine/Cargo.toml --all-targets --features profiling -- -D warnings
      - name: Runtime metrics test
        run: cargo test --manifest-path match_engine/Cargo.toml --features profiling --test cluster metrics_exposes_data_server_and_runtime_stats --locked

  bench-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Apply-path allocation gate
        run: cargo bench --manifest-path match_engine/Cargo.toml --locked --bench apply_path -- --check
      - name: Book replay latency gate
        run: cargo bench --manifest-path match_engine/Cargo.toml --locked --bench book_replay -- --check
      - name: Replay-mix latency gate
        run: cargo bench --manifest-path match_engine/Cargo.toml --locked --bench replay_mix -- --check

  marketdata-aeron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rusteron is pinned to 0.2.13 and uses precompiled Aeron C libraries
      # (`static`, `precompile-rustls`); no Java or cmake is required, but the
      # static Linux link needs the uuid and bsd development libraries.
      - name: Install Aeron system libraries
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev uuid-dev
      - name: Engine Aeron sink test
        run: cargo test --manifest-path match_engine/Cargo.toml --features market-data-aeron,aeron-precompiled --lib market_data::aeron --locked
      - name: Market-data Aeron end-to-end test
        run: cargo test --manifest-path market_data_system/Cargo.toml --features aeron,aeron-precompiled --test aeron --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: cargo check --manifest-path match_engine/Cargo.toml --all-targets --locked
      - name: Check control-plane MSRV
        run: cargo check --manifest-path k8s_control_plane/Cargo.toml --all-targets --locked
