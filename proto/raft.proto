syntax = "proto3";

package matchengine.raft.v1;

// The Raft peer-to-peer transport.
//
// Request and response bodies are `postcard`-encoded openraft types carried in the
// `payload` bytes fields. The envelope stays protobuf so gRPC owns framing,
// multiplexing, deadlines and streaming; the payload stays binary so the Raft
// hot path does not pay for JSON.
service RaftService {
  // Unary AppendEntries. Used for single requests and by transports that do not
  // pipeline.
  rpc AppendEntries(AppendRequest) returns (AppendResponse);

  // Unary RequestVote.
  rpc Vote(VoteCallRequest) returns (VoteCallResponse);

  // Unary PreVote. Same payload as Vote, but the receiver must not persist a
  // vote or change its term. A peer that has not heard from a leader for one
  // election timeout asks before campaigning, so an isolated node cannot
  // inflate the term and depose a healthy leader.
  rpc PreVote(VoteCallRequest) returns (VoteCallResponse);

  // Streamed full-snapshot install. The first chunk carries `vote` and `meta`;
  // every chunk carries `data`, a monotonically increasing byte `offset`, and the
  // final chunk sets `done`. A stream that ends without `done` is discarded.
  rpc InstallSnapshot(stream SnapshotChunk) returns (SnapshotResponse);

  // Bidirectional streaming AppendEntries. The server replies once per request in
  // request order.
  rpc AppendStream(stream AppendRequest) returns (stream AppendResponse);

  // Ask a peer to accept a leadership transfer. The payload is a postcard-encoded
  // openraft `TransferLeaderRequest`.
  rpc TransferLeader(TransferLeaderCall) returns (TransferLeaderResponse);
}

// Internal match-event streaming for clearing systems and MQ bridge sidecars.
//
// Pages are `postcard`-encoded `EventsResponse` values, the same schema as
// `POST /events`. The stream is anchored with one ReadIndex at open (the
// serving node must be the leader); later pages are committed applied events.
service EventService {
  // Stream event pages as they are applied. An idle stream delivers an empty
  // page after at most `wait_ms`, which doubles as a liveness heartbeat.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsPage);
}

message StreamEventsRequest {
  // Cursor: events strictly after this id. Omit both fields to start at the
  // oldest retained event.
  optional uint64 after_log_index = 1;
  optional uint32 after_ordinal = 2;
  // Page size, 1..=1000 (default 500).
  optional uint32 limit = 3;
  // Idle wait per page in milliseconds, 0..=1000 (default 0, no wait).
  optional uint32 wait_ms = 4;
  // Stop after this many pages; 0 streams until the client cancels.
  optional uint32 max_pages = 5;
}

message StreamEventsPage {
  // JSON-encoded `EventsResponse`, the same object as `POST /events`.
  bytes payload = 1;
}

message AppendRequest {
  bytes payload = 1;
}

message AppendResponse {
  bytes payload = 1;
}

message VoteCallRequest {
  bytes payload = 1;
}

message VoteCallResponse {
  bytes payload = 1;
}

message SnapshotChunk {
  // Encoded `VoteOf<C>`; set on the first chunk only.
  bytes vote = 1;
  // Encoded `SnapshotMetaOf<C>`; set on the first chunk only.
  bytes meta = 2;
  // Snapshot bytes for this chunk.
  bytes data = 3;
  // Byte offset of `data` in the snapshot. Must equal the number of bytes
  // already received.
  uint64 offset = 4;
  // Set on the terminal chunk. A terminal chunk may carry empty `data`.
  bool done = 5;
}

message SnapshotResponse {
  bytes payload = 1;
}

message TransferLeaderCall {
  bytes payload = 1;
}

message TransferLeaderResponse {
  bytes payload = 1;
}
