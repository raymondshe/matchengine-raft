# Kustomize base for the reference control plane. Deployable overlays live in
# k8s_control_plane/overlays/{lab,production}.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crds.yaml
  - rbac.yaml
  - manager.yaml
  - operator.yaml
  - web-ingress.yaml
  - backup.yaml
  - prometheus/bridge.yaml
  - prometheus/prometheus.yaml
  - prometheus/grafana.yaml
  - prometheus/loki.yaml

# The bridge script has a single source of truth: the file on disk. Previously
# it was duplicated verbatim in bridge.yaml's ConfigMap and the two copies
# drifted. Disable the hash suffix so the Deployment's static volume reference
# keeps working.
configMapGenerator:
  - name: json-bridge-script
    namespace: match-observability
    files:
      - bridge.py=prometheus/json_bridge.py
generatorOptions:
  disableNameSuffixHash: true
