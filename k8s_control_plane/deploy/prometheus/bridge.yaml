# JSON -> Prometheus bridge for the OrbStack lab.
# Reads engine and market-data JSON /metrics through the Kubernetes API and
# serves one aggregated text exposition for Prometheus.
---
apiVersion: v1
kind: Namespace
metadata:
  name: match-observability
  labels:
    matching.io/role: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: json-bridge
  namespace: match-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: match-json-bridge
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: match-json-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: match-json-bridge
subjects:
  - kind: ServiceAccount
    name: json-bridge
    namespace: match-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: json-bridge-script
  namespace: match-observability
data:
  bridge.py: |-
    #!/usr/bin/env python3
    """Expose the lab's JSON /metrics endpoints as Prometheus text.

    The engine serves a JSON envelope ({"Ok": {...RaftMetrics plus data_metrics,
    server_metrics, transport_metrics...}}) and the market-data service serves a
    JSON stats object. Prometheus cannot scrape JSON, and rebuilding every engine
    pod just to add a text endpoint would be a needless fleet roll, so this small
    bridge discovers the rendered Services through the Kubernetes API, converts
    their JSON to numeric Prometheus samples and serves one aggregated /metrics.

    Only the standard library is used. Deployed as a single replica in the
    match-observability namespace; reads services/endpoints in match-eu-1.

    Environment:
      TARGET_NAMESPACE   default match-eu-1
      BRIDGE_PORT        default 9090
      CACHE_SECONDS      default 5
    """
    import json
    import os
    import re
    import ssl
    import threading
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    NS = os.environ.get("TARGET_NAMESPACE", "match-eu-1")
    PORT = int(os.environ.get("BRIDGE_PORT", "9090"))
    CACHE_SECONDS = float(os.environ.get("CACHE_SECONDS", "5"))
    K8S = "https://kubernetes.default.svc"
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    SKIP_KEYS = {"runtime_stats", "symbols_detail", "events", "orders", "log"}
    STATE_KEYS = {"state", "role", "id", "state_machine", "current_leader"}
    MAX_DEPTH = 8


    def k8s_get(path):
        token = open(os.path.join(SA_DIR, "token")).read().strip()
        ctx = ssl.create_default_context(cafile=os.path.join(SA_DIR, "ca.crt"))
        req = urllib.request.Request(K8S + path, headers={"Authorization": "Bearer " + token})
        with urllib.request.urlopen(req, context=ctx, timeout=5) as response:
            return json.load(response)


    def pod_for(svc, port):
        """Map a Service port number to the pod backing its first endpoint."""
        try:
            eps = k8s_get(
                f"/api/v1/namespaces/{NS}/endpoints/{svc['metadata']['name']}"
            )
            for subset in eps.get("subsets", []):
                for p in subset.get("ports", []):
                    if p.get("port") == port:
                        addresses = subset.get("addresses", [])
                        if addresses:
                            ref = addresses[0].get("targetRef") or {}
                            return ref.get("name", "")
        except Exception:
            pass
        return ""


    def discover():
        """Return [(url, metric_prefix, labels)] for every rendered service."""
        targets = []
        try:
            services = k8s_get(f"/api/v1/namespaces/{NS}/services").get("items", [])
        except Exception as exc:
            print("bridge: service discovery failed:", exc, flush=True)
            return targets
        for svc in services:
            name = svc["metadata"]["name"]
            ports = svc.get("spec", {}).get("ports", [])
            if name.endswith("-metrics"):
                shard = name[: -len("-metrics")]
                for p in ports:
                    pname = p.get("name", "")
                    if not pname.startswith("metrics-"):
                        continue
                    slot = pname.split("-", 1)[1]
                    pod = pod_for(svc, p["port"])
                    # The renderer declares a metrics port for every configured
                    # slot, including reserved/empty ones with no endpoints. Those
                    # are not failures; skip them so alerts stay meaningful.
                    if not pod:
                        continue
                    labels = {
                        "cell": svc["metadata"].get("labels", {}).get("matching.io/cell", NS),
                        "shard": shard,
                        "slot": slot,
                        "pod": pod,
                    }
                    targets.append((
                        f"http://{name}.{NS}.svc.cluster.local:{p['port']}/metrics",
                        "matchengine", labels,
                    ))
            elif name.endswith("-marketdata"):
                labels = {
                    "cell": svc["metadata"].get("labels", {}).get("matching.io/cell", NS),
                    "service": name,
                    "pod": pod_for(svc, next((p["port"] for p in ports if p.get("name") == "ws"), 0)),
                }
                for p in ports:
                    if p.get("name") == "ws":
                        targets.append((
                            f"http://{name}.{NS}.svc.cluster.local:{p['port']}/metrics",
                            "marketdata", labels,
                        ))
        return targets


    def sanitize(name):
        return re.sub(r"[^a-zA-Z0-9_]", "_", str(name)).lower()


    def label_text(labels):
        if not labels:
            return ""
        parts = ",".join(
            f'{k}="{str(v).replace(chr(92), chr(92)*2).replace(chr(34), chr(92)+chr(34))}"'
            for k, v in sorted(labels.items())
        )
        return "{" + parts + "}"


    def emit(out, name, value, labels, suffix=""):
        metric = sanitize(name) + suffix
        if not metric or metric[0].isdigit():
            metric = "_" + metric
        out.append(f"{metric}{label_text(labels)} {value}")


    def flatten(obj, prefix, labels, out, depth=0):
        if depth > MAX_DEPTH:
            return
        if isinstance(obj, dict):
            for key, value in obj.items():
                if key in SKIP_KEYS:
                    continue
                name = f"{prefix}_{key}" if prefix else key
                if value is None:
                    continue
                flatten(value, name, labels, out, depth + 1)
        elif isinstance(obj, bool):
            emit(out, prefix, 1 if obj else 0, labels)
        elif isinstance(obj, (int, float)):
            emit(out, prefix, obj, labels)
        elif isinstance(obj, str):
            if prefix.rsplit("_", 1)[-1] in STATE_KEYS:
                extra = dict(labels)
                extra[sanitize(prefix.rsplit("_", 1)[-1])] = obj
                emit(out, prefix + "_info", 1, extra)
        elif isinstance(obj, (list, tuple)):
            for index, value in enumerate(obj[:64]):
                flatten(value, f"{prefix}_{index}", labels, out, depth + 1)


    def fetch(target):
        url, prefix, labels = target
        try:
            with urllib.request.urlopen(url, timeout=3) as response:
                payload = json.load(response)
            if isinstance(payload, dict) and "Ok" in payload:
                payload = payload["Ok"]
            out = []
            flatten(payload, prefix, labels, out)
            if isinstance(payload, dict) and "current_leader" in payload:
                # current_leader is Option<Id> and node IDs are 0-based, so 0 is a
                # valid leader id. Report presence separately from the id.
                emit(
                    out,
                    prefix + "_has_leader",
                    1 if payload["current_leader"] is not None else 0,
                    labels,
                )
            return out
        except urllib.error.URLError as exc:
            if isinstance(exc.reason, ConnectionRefusedError):
                # A declared metrics port whose slot was never started (reserved
                # or supervisor slot) is not a scrape failure.
                return []
            print(f"bridge: scrape {url} failed: {exc}", flush=True)
            return [f"bridge_scrape_failed{{target={chr(34)}{url}{chr(34)}}} 1"]
        except Exception as exc:
            print(f"bridge: scrape {url} failed: {exc}", flush=True)
            return [f"bridge_scrape_failed{{target={chr(34)}{url}{chr(34)}}} 1"]


    class Cache:
        def __init__(self):
            self.lock = threading.Lock()
            self.expires = 0.0
            self.lines = ["# bridge: warming up"]

        def metrics(self):
            now = time.monotonic()
            with self.lock:
                if now < self.expires:
                    return "\n".join(self.lines) + "\n"
            lines = ["# Generated by the match-engine JSON->Prometheus bridge"]
            targets = discover()
            if not targets:
                # An empty target list means discovery itself failed; never fail
                # silently into a scrape with only a comment line.
                lines.append('bridge_scrape_failed{target="discovery"} 1')
            for target in targets:
                lines.extend(fetch(target))
            with self.lock:
                self.lines = lines
                self.expires = time.monotonic() + CACHE_SECONDS
            return "\n".join(lines) + "\n"


    CACHE = Cache()


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.split("?")[0] not in ("/metrics", "/healthz"):
                self.send_error(404)
                return
            body = CACHE.metrics().encode() if self.path.startswith("/metrics") else b"ok\n"
            content = "text/plain; version=0.0.4; charset=utf-8"
            self.send_response(200)
            self.send_header("Content-Type", content)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            pass


    if __name__ == "__main__":
        print(f"bridge: listening on :{PORT}, target namespace {NS}", flush=True)
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-bridge
  namespace: match-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: json-bridge
  template:
    metadata:
      labels:
        app: json-bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: json-bridge
      containers:
        - name: bridge
          image: python:3.12-alpine
          command: ["python", "/etc/bridge/bridge.py"]
          env:
            - name: TARGET_NAMESPACE
              value: match-eu-1
            - name: BRIDGE_PORT
              value: "9090"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /etc/bridge
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: json-bridge-script
---
apiVersion: v1
kind: Service
metadata:
  name: json-bridge
  namespace: match-observability
  labels:
    app: json-bridge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
spec:
  selector:
    app: json-bridge
  ports:
    - name: http
      port: 9090
      targetPort: http
