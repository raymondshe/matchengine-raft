# JSON -> Prometheus bridge for the OrbStack lab.
# Reads engine and market-data JSON /metrics through the Kubernetes API and
# serves one aggregated text exposition for Prometheus.
---
apiVersion: v1
kind: Namespace
metadata:
  name: match-observability
  labels:
    matching.io/role: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: json-bridge
  namespace: match-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: match-json-bridge
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: match-json-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: match-json-bridge
subjects:
  - kind: ServiceAccount
    name: json-bridge
    namespace: match-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-bridge
  namespace: match-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: json-bridge
  template:
    metadata:
      labels:
        app: json-bridge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: json-bridge
      containers:
        - name: bridge
          image: python:3.12-alpine
          command: ["python", "/etc/bridge/bridge.py"]
          env:
            - name: TARGET_NAMESPACE
              value: match-eu-1
            - name: BRIDGE_PORT
              value: "9090"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /etc/bridge
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: json-bridge-script
---
apiVersion: v1
kind: Service
metadata:
  name: json-bridge
  namespace: match-observability
  labels:
    app: json-bridge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
spec:
  selector:
    app: json-bridge
  ports:
    - name: http
      port: 9090
      targetPort: http
