# Lab TDengine for the historical bar tier.
#
# One dnode / one vgroup / REPLICA 1 is the documented lab profile
# (docs/HISTORICAL_BARS.md §4.7.2). Production uses three dnodes and three
# mnodes with REPLICA 3; this manifest is deliberately not that topology.
# Data is on a local-path PVC so a pod eviction (e.g. DiskPressure) does not
# wipe the whole bar history and force every writer to rebuild its schema.
apiVersion: v1
kind: Service
metadata:
  name: tdengine
  namespace: match-eu-1
  labels:
    matching.io/role: market-data-history
spec:
  type: ClusterIP
  selector:
    app: tdengine
  ports:
    - name: rest
      port: 6041
      targetPort: 6041
    - name: native
      port: 6030
      targetPort: 6030
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tdengine-config
  namespace: match-eu-1
data:
  taos.cfg: |
    ########################################################
    #                                                      #
    #                  Configuration                       #
    #                                                      #
    ########################################################

    ######### 0. Client only configurations #############

    # The interval for CLI to send heartbeat to mnode
    # shellActivityTimer        3


    ############### 1. Cluster End point ############################

    # The end point of the first dnode in the cluster to be connected to when this dnode or the CLI utility is started
    # firstEp                   hostname:6030

    # The end point of the second dnode to be connected to if the firstEp is not available
    # secondEp


    ############### 2. Configuration Parameters of current dnode #####

    # The FQDN of the host on which this dnode will be started. It can be IP address
    fqdn                      localhost

    # The port for external access after this dnode is started
    # serverPort                6030

    # The maximum number of connections a dnode can accept
    # maxShellConns             5000

    # The directory for writing log files, if you are using Windows platform please change to Windows path
    # logDir                    /var/log/taos

    # All data files are stored in this directory, if you are using Windows platform please change to Windows path
    # dataDir                   /var/lib/taos

    # temporary file's directory, if you are using Windows platform please change to Windows path
    # tempDir                   /tmp/

    # Switch for allowing to collect and report service usage information
    # telemetryReporting        1

    # Switch for allowing to collect and report crash information
    # crashReporting            1

    # The maximum number of vnodes supported by this dnode
    # supportVnodes             0

    # The interval of this dnode reporting status to mnode, [1..10] seconds
    # statusInterval            1

    # The minimum sliding window time, milli-second
    # minSlidingTime            10

    # The minimum time window, milli-second
    # minIntervalTime           10

    # The maximum allowed query buffer size in MB during query processing for each data node
    # -1 no limit (default)
    # 0  no query allowed, queries are disabled
    # queryBufferSize           -1

    # The compressed rpc message, option:
    #  -1 (no compression)
    #   0 (all message compressed),
    # > 0 (rpc message body which larger than this value will be compressed)
    # compressMsgSize           -1

    # query retrieved column data compression option:
    #  -1 (no compression)
    #   0 (all retrieved column data compressed),
    # > 0 (any retrieved column size greater than this value all data will be compressed.)
    # compressColData           -1

    # system time zone
    # timezone                  UTC-8

    # system time zone (for windows 10)
    # timezone              Asia/Shanghai (CST, +0800)

    # system locale
    # locale                    en_US.UTF-8

    # system charset
    # charset                   UTF-8

    # stop writing logs when the disk size of the log folder is less than this value
    # minimalLogDirGB           1.0

    # stop writing temporary files when the disk size of the tmp folder is less than this value
    # minimalTmpDirGB           1.0

    # if free disk space is less than this value, this dnode will fail to start
    # minimalDataDirGB          2.0

    # enable/disable system monitor
    # monitor                   1


    # The following parameter is used to limit the maximum number of lines in log files.
    # max number of lines per log filters
    # numOfLogLines             10000000

    # write log in async way: 1 - async, 0 - sync
    # asyncLog                  1

    # time period of keeping log files, in days
    # logKeepDays               0


    ############ 3. Debug Flag and levels #############################################

    # The following parameters are used for debug purpose only by this dnode.
    # debugFlag is a 8 bits mask: FILE-SCREEN-UNUSED-HeartBeat-DUMP-TRACE_WARN-ERROR
    # Available debug levels are:
    # 131: output warning and error
    # 135: output debug, warning and error
    # 143: output trace, debug, warning and error to log
    # 199: output debug, warning and error to both screen and file
    # 207: output trace, debug, warning and error to both screen and file

    # debug flag for all log type, take effect when non-zero value
    debugFlag                 1

    # debug flag for timer
    tmrDebugFlag                 1
    # debug flag for util
    uDebugFlag                 1
    # debug flag for rpc
    rpcDebugFlag                 1
    # debug flag for jni
    jniDebugFlag                 1
    # debug flag for query
    qDebugFlag                 1
    # debug flag for client driver
    cDebugFlag                 1
    # debug flag for dnode messages
    dDebugFlag                 1
    # debug flag for vnode
    vDebugFlag                 1
    # debug flag for meta management messages
    mDebugFlag                 1
    # debug flag for wal
    wDebugFlag                 1
    # debug flag for sync module
    sDebugFlag                 1
    # debug flag for tsdb
    tsdbDebugFlag                 1
    # debug flag for tq
    tqDebugFlag                 1
    # debug flag for fs
    fsDebugFlag                 1
    # debug flag for udf
    udfDebugFlag                 1
    # debug flag for sma
    smaDebugFlag                 1
    # debug flag for index
    idxDebugFlag                 1
    # debug flag for tdb
    tdbDebugFlag                 1
    # debug flag for meta
    metaDebugFlag                 1
    # generate core file when service crash
    # enableCoreFile            1

    # force the use of parameters from the configuration file
    # forceReadConfig           0
    monitor 0
    monitorFQDN localhost

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tdengine-adapter-config
  namespace: match-eu-1
data:
  taosadapter.toml: |
    # Enable pprof debug mode. If set to true, pprof debugging is enabled.
    debug = false

    # The directory where TDengine's configuration file (taos.cfg) is located.
    taosConfigDir = ""

    # The port on which the server listens.
    port = 6041

    # When the server returns an error, use a non-200 HTTP status code if set to true.
    httpCodeServerError = false

    # Automatically create the database when writing data with the schemaless feature if set to true.
    smlAutoCreateDB = false

    # Instance ID of the taosAdapter.
    instanceId = 32

    # The maximum number of concurrent calls allowed for the C synchronized method.0 means use CPU core count.
    #maxSyncConcurrentLimit = 0

    # The maximum number of concurrent calls allowed for the C asynchronous method. 0 means use CPU core count.
    #maxAsyncConcurrentLimit = 0

    [cors]
    # If set to true, allows cross-origin requests from any origin (CORS).
    allowAllOrigins = true

    [pool]
    # The maximum number of connections to the server. If set to 0, use cpu count * 2.
    # maxConnect = 0

    # The maximum number of idle connections to the server. Should match maxConnect.
    # maxIdle = 0

    # The maximum number of connections waiting to be established. 0 means no limit.
    maxWait = 0

    # Maximum time to wait for a connection. 0 means no timeout.
    waitTimeout = 60

    [ssl]
    # Enable SSL. Applicable for the Enterprise Edition.
    enable = false
    certFile = ""
    keyFile = ""

    [log]
    # The directory where log files are stored.
    # path = "/var/log/taos"

    # The log level. Options are: trace, debug, info, warning, error.
    level = "warning"

    # Number of log file rotations before deletion.
    rotationCount = 30

    # The number of days to retain log files.
    keepDays = 30

    # The maximum size of a log file before rotation.
    rotationSize = "1GB"

    # If set to true, log files will be compressed.
    compress = false

    # Minimum disk space to reserve. Log files will not be written if disk space falls below this limit.
    reservedDiskSize = "1GB"

    # Enable logging of HTTP SQL queries.
    enableRecordHttpSql = false

    # Number of HTTP SQL log rotations before deletion.
    sqlRotationCount = 2

    # Time interval for rotating HTTP SQL logs.
    sqlRotationTime = "24h"

    # Maximum size of HTTP SQL log files before rotation.
    sqlRotationSize = "1GB"

    [monitor]
    # If set to true, disables monitoring.
    disable = true

    # Interval for collecting metrics.
    collectDuration = "3s"

    # Indicates if running inside a Docker container.
    incgroup = false

    # When memory usage reaches this percentage, query execution will be paused.
    pauseQueryMemoryThreshold = 70

    # When memory usage reaches this percentage, both queries and inserts will be paused.
    pauseAllMemoryThreshold = 80

    # The identity of the current instance. If empty, it defaults to 'hostname:port'.
    identity = ""

    [uploadKeeper]
    # Enable uploading of metrics to TaosKeeper.
    enable = true

    # URL of the TaosKeeper service to which metrics will be uploaded.
    url = "http://127.0.0.1:6043/adapter_report"

    # Interval for uploading metrics.
    interval = "15s"

    # Timeout for uploading metrics.
    timeout = "5s"

    # Number of retries when uploading metrics fails.
    retryTimes = 3

    # Interval between retries for uploading metrics.
    retryInterval = "5s"

    [opentsdb]
    # Enable the OpenTSDB HTTP plugin.
    enable = true

    [influxdb]
    # Enable the InfluxDB plugin.
    enable = true

    [statsd]
    # Enable the StatsD plugin.
    enable = false

    # The port on which the StatsD plugin listens.
    port = 6044

    # The database name used by the StatsD plugin.
    db = "statsd"

    # The username used to connect to the TDengine database.
    user = "root"

    # The password used to connect to the TDengine database.
    password = "taosdata"

    # The number of worker threads for processing StatsD data.
    worker = 10

    # Interval for gathering StatsD metrics.
    gatherInterval = "5s"

    # The network protocol used by StatsD (e.g., udp4, tcp).
    protocol = "udp4"

    # Maximum number of TCP connections allowed for StatsD.
    maxTCPConnections = 250

    # If set to true, enables TCP keep-alive for StatsD connections.
    tcpKeepAlive = false

    # Maximum number of pending messages StatsD allows.
    allowPendingMessages = 50000

    # If set to true, deletes the counter cache after gathering metrics.
    deleteCounters = true

    # If set to true, deletes the gauge cache after gathering metrics.
    deleteGauges = true

    # If set to true, deletes the set cache after gathering metrics.
    deleteSets = true

    # If set to true, deletes the timing cache after gathering metrics.
    deleteTimings = true

    [collectd]
    # Enable the Collectd plugin.
    enable = false

    # The port on which the Collectd plugin listens.
    port = 6045

    # The database name used by the Collectd plugin.
    db = "collectd"

    # The username used to connect to the TDengine database.
    user = "root"

    # The password used to connect to the TDengine database.
    password = "taosdata"

    # Number of worker threads for processing Collectd data.
    worker = 10

    [opentsdb_telnet]
    # Enable the OpenTSDB Telnet plugin.
    enable = false

    # Maximum number of TCP connections allowed for the OpenTSDB Telnet plugin.
    maxTCPConnections = 250

    # If set to true, enables TCP keep-alive for OpenTSDB Telnet connections.
    tcpKeepAlive = false

    # List of databases to which OpenTSDB Telnet plugin writes data.
    dbs = ["opentsdb_telnet", "collectd", "icinga2", "tcollector"]

    # The ports on which the OpenTSDB Telnet plugin listens, corresponding to each database.
    ports = [6046, 6047, 6048, 6049]

    # The username used to connect to the TDengine database for OpenTSDB Telnet.
    user = "root"

    # The password used to connect to the TDengine database for OpenTSDB Telnet.
    password = "taosdata"

    # Batch size for processing OpenTSDB Telnet data.
    batchSize = 1

    # Interval between flushing data to the database. 0 means no interval.
    flushInterval = "0s"

    [node_exporter]
    # Enable the Node Exporter plugin.
    enable = false

    # The database name used by the Node Exporter plugin.
    db = "node_exporter"

    # The username used to connect to the TDengine database.
    user = "root"

    # The password used to connect to the TDengine database.
    password = "taosdata"

    # List of URLs to gather Node Exporter metrics from.
    urls = ["http://localhost:9100"]

    # Timeout for waiting for a response from the Node Exporter plugin.
    responseTimeout = "5s"

    # Username for HTTP authentication, if applicable.
    httpUsername = ""

    # Password for HTTP authentication, if applicable.
    httpPassword = ""

    # Bearer token for HTTP requests, if applicable.
    httpBearerTokenString = ""

    # Path to the CA certificate file for SSL validation.
    caCertFile = ""

    # Path to the client certificate file for SSL validation.
    certFile = ""

    # Path to the client key file for SSL validation.
    keyFile = ""

    # If set to true, skips SSL certificate verification.
    insecureSkipVerify = true

    # Interval for gathering Node Exporter metrics.
    gatherDuration = "5s"

    [prometheus]
    # Enable the Prometheus plugin.
    enable = true

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdengine-data
  namespace: match-eu-1
  labels:
    matching.io/role: market-data-history
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdengine
  namespace: match-eu-1
  labels:
    app: tdengine
    matching.io/role: market-data-history
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tdengine
  template:
    metadata:
      labels:
        app: tdengine
        matching.io/role: market-data-history
    spec:
      containers:
        - name: tdengine
          image: tdengine/tdengine:3.3.6.13
          imagePullPolicy: IfNotPresent
          env:
            # Single-node lab: bind the RPC endpoint to localhost and let the
            # image's entrypoint start a standalone mnode. taosAdapter on 6041
            # is the only port clients need; native 6030 stays cluster-internal.
            - name: TAOS_FQDN
              value: localhost
            # Move the adapter off 6041 so the IPv4 bridge can own that port;
            # the Service and NetworkPolicy stay on 6041 for every client.
            - name: TAOS_ADAPTER_PORT
              value: "6042"
            # Suppress taosAdapter's per-request WEB INFO/GIN debug logs in the
            # lab. Keep warnings and errors so real failures remain visible.
            - name: TAOS_ADAPTER_LOG_LEVEL
              value: panic
            - name: TAOS_ADAPTER_DEBUG
              value: "false"
          ports:
            - name: rest
              containerPort: 6041
            - name: native
              containerPort: 6030
          readinessProbe:
            tcpSocket:
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/taos
            - name: data
              mountPath: /var/log/taos
            - name: adapter-config
              mountPath: /etc/taos/taosadapter.toml
              subPath: taosadapter.toml
              readOnly: true
            - name: server-config
              mountPath: /etc/taos/taos.cfg
              subPath: taos.cfg
              readOnly: true
        # taosadapter 3.3.6 binds an IPv6-only :::6041 listener, which this
        # lab's IPv4 ClusterIP cannot reach. The adapter is moved to 6042 and
        # this sidecar owns IPv4 0.0.0.0:6041, forwarding to 127.0.0.1:6042.
        # The Service and the market-data NetworkPolicy stay on 6041.
        - name: ipv4-bridge
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command: ["node", "-e"]
          args:
            - |
              const net = require('net');
              net.createServer((client) => {
                const upstream = net.connect({ host: '127.0.0.1', port: 6042 });
                client.on('error', () => upstream.destroy());
                upstream.on('error', () => client.destroy());
                client.pipe(upstream).pipe(client);
              }).listen({ host: '0.0.0.0', port: 6041 }, () => console.log('ipv4 bridge 6041 -> 127.0.0.1:6042'));
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tdengine-data
        - name: adapter-config
          configMap:
            name: tdengine-adapter-config
        - name: server-config
          configMap:
            name: tdengine-config
