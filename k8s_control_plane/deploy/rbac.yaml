# Least-privilege RBAC for the CRD-backed manager.
#
# Apply the CRDs first:
#   cargo run --manifest-path k8s_control_plane/Cargo.toml -- crds \
#     | kubectl apply -f -
#
# The manager needs list/watch to rebuild its cache, create/update/delete for desired state and
# the /status subresource for the demo's simulated observations. It never talks to etcd directly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: match-manager
  namespace: match-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: match-manager-crd
rules:
  - apiGroups: ["matching.io"]
    resources:
      - cells
      - symbolshards
      - tradingsymbols
      - symboldeployments
      - symbolroutes
      - marketdataservices
      - ordersystems
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["matching.io"]
    resources:
      - cells/status
      - symbolshards/status
      - tradingsymbols/status
      - symboldeployments/status
      - symbolroutes/status
      - marketdataservices/status
      - ordersystems/status
    verbs: ["get", "update", "patch"]
  # Read-only image inventory for the manager's upgrade picker. The manager lists nodes to read
  # `status.images` (cached tags/digests) and engine-labeled pods to learn what is running.
  # It never creates, updates or deletes pods.
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: match-manager-crd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: match-manager-crd
subjects:
  - kind: ServiceAccount
    name: match-manager
    namespace: match-control
---
# The manager reads the backup/status Jobs' published ConfigMap for the Backup tab.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: match-manager-backup-status
  namespace: match-control
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["match-backup-status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: match-manager-backup-status
  namespace: match-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: match-manager-backup-status
subjects:
  - kind: ServiceAccount
    name: match-manager
    namespace: match-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: match-operator
  namespace: match-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: match-operator
rules:
  - apiGroups: ["matching.io"]
    resources:
      - cells
      - symbolshards
      - tradingsymbols
      - symboldeployments
      - symbolroutes
      - marketdataservices
      - ordersystems
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["matching.io"]
    resources:
      - cells/status
      - symbolshards/status
      - tradingsymbols/status
      - symboldeployments/status
      - symbolroutes/status
      - marketdataservices/status
      - ordersystems/status
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: match-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: match-operator
subjects:
  - kind: ServiceAccount
    name: match-operator
    namespace: match-control
---
# Backup/restore executor (`k8s-control-plane backup` / `restore`). Run it as a Job or CronJob
# with this ServiceAccount. It reads the catalog CRDs, creates CSI snapshots, restores snapshots
# into temporary PVCs for verification, and writes desired state only when restore --apply-crds
# is requested.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: match-backup
  namespace: match-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: match-backup
rules:
  - apiGroups: ["matching.io"]
    resources:
      - cells
      - symbolshards
      - tradingsymbols
      - symboldeployments
      - symbolroutes
      - marketdataservices
      - ordersystems
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshots"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: match-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: match-backup
subjects:
  - kind: ServiceAccount
    name: match-backup
    namespace: match-control
---
# The backup/status Jobs publish the latest bundle/drill result for the manager Backup view.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: match-backup-status
  namespace: match-control
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["match-backup-status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: match-backup-status
  namespace: match-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: match-backup-status
subjects:
  - kind: ServiceAccount
    name: match-backup
    namespace: match-control
