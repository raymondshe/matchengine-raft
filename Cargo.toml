[package]
name = "matchengine-raft"
version = "0.0.3"
edition = "2024"
rust-version = "1.89"
authors = [
    "Raymond <rshen.sy@gmail.com>"
]
categories = ["algorithms", "asynchronous", "data-structures"]
description = "A distributed matching engine built upon `openraft`."
homepage = "https://github.com/raymondshe/matchengine-raft"
keywords = ["raft", "consensus", "matching-engine"]
license = "MIT"
repository = "https://github.com/raymondshe/matchengine-raft"
readme = "README.md"

[[bench]]
name = "matchengine"
harness = false

[dependencies]
actix-web = "4.18.1"
async-stream = "0.3.6"
clap = { version = "4.6.7", features = ["derive", "env"] }
crc32fast = "1.5.3"
env_logger = "0.11.11"
openraft = { version = "0.10.0-alpha.37", features = ["serde", "type-alias"] }
futures = "0.3.34"
i256 = "0.2.5"
postcard = { version = "1.1.3", features = ["use-std"] }
prost = "0.14.4"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "net", "io-util", "macros", "rt", "rt-multi-thread", "time", "tracing"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
tonic = "0.14.8"
tonic-prost = "0.14.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
anyhow = "1.0.104"
maplit = "1.0.2"
sled = "0.34.7"

[build-dependencies]
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.8"

[features]
docinclude = [] # Used only for activating `doc(include="...")` on nightly.

[package.metadata.docs.rs]
features = ["docinclude"] # Activate `docinclude` during docs.rs build.
