[package]
name = "matchengine-k8s-control-plane"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Reference implementation of the matchengine-raft Kubernetes control plane (demo)"

[workspace]

[[bin]]
name = "k8s-control-plane"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4.6.7", features = ["derive", "env"] }
http-body-util = "0.1"
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "sync",
  "time",
  "fs",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
