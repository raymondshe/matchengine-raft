[package]
name = "matchengine-marketdata"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
actix-web = "4.18.1"
actix-ws = "0.3"
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3"
matchengine-raft = { path = "../.." }
# Optional Aeron transport. Pinned to 0.2.13: 0.2.14+ uses an unstable API.
rusteron-client = { version = "=0.2.13", default-features = false, features = ["static", "precompile-rustls"], optional = true }
rusteron-media-driver = { version = "=0.2.13", default-features = false, features = ["static", "precompile-rustls"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio-stream = "0.1.19"
tokio = { version = "1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
  "net",
  "io-util",
  "fs",
  "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
# Ingest the engine feed over Aeron. `cargo run --features aeron -- --aeron-channel ...`
aeron = ["dep:rusteron-client", "dep:rusteron-media-driver"]

[dev-dependencies]
tokio-tungstenite = "0.24"

[[bench]]
name = "ws_fanout"
harness = false
