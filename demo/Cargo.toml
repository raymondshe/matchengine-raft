[package]
name = "matchengine-raft-demo"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
actix-web = "4.18.1"
anyhow = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
matchengine-raft = { path = ".." }
openraft = { version = "0.10.0-alpha.37", features = ["serde", "type-alias"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
